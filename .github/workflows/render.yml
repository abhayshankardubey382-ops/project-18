name: Render 25-Min Horror Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore Saved Parts Cache
        uses: actions/cache@v4
        with:
          path: 2026-11-13_Project_18_9Hz
          key: project-18-9hz-${{ github.run_id }}
          restore-keys: |
            project-18-9hz-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts mutagen requests

      - name: Run 25-Min Pipeline
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python build_movie.py

      - name: Upload All Parts & Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project-18-9Hz-2026-11-13
          path: 2026-11-13_Project_18_9Hz/
